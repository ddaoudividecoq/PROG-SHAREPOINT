name: Mise a jour programmation

on:
  schedule:
    - cron: '0 6 * * *'      # tous les lundis a 6h00 UTC
  workflow_dispatch:          # bouton de lancement manuel

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install requests

      - name: Recuperer les concerts
        run: python build.py
        env:
          BATACLAN_AUTH:          ${{ secrets.BATACLAN_AUTH }}
          # CMS commun Accor + adidas : un jeton suffit.
          # Option A (recommandee) : un jeton statique.
          ACCOR_CMS_TOKEN:        ${{ secrets.ACCOR_CMS_TOKEN }}
          # Option B (repli) : identifiants, si tu ne peux pas creer de jeton statique.
          ACCOR_CMS_EMAIL:        ${{ secrets.ACCOR_CMS_EMAIL }}
          ACCOR_CMS_PASSWORD:     ${{ secrets.ACCOR_CMS_PASSWORD }}
          # Optionnel : images de secours via Spotify
          SPOTIFY_CLIENT_ID:      ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET:  ${{ secrets.SPOTIFY_CLIENT_SECRET }}

      - name: Publier les changements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/events.json
          git diff --staged --quiet || git commit -m "Mise a jour programmation"
          git push
