name: Mise a jour programmation

on:
  schedule:
    - cron: '0 6 * * 1'      # tous les lundis a 6h00 UTC
  workflow_dispatch:          # bouton de lancement manuel

permissions:
  contents: write             # necessaire pour commiter events.json

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install requests

      - name: Recuperer les concerts
        run: python build.py
        env:
          ACCOR_API_KEY:  ${{ secrets.ACCOR_API_KEY }}
          ADIDAS_API_KEY: ${{ secrets.ADIDAS_API_KEY }}
          BATACLAN_AUTH:  ${{ secrets.BATACLAN_AUTH }}

      - name: Publier les changements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/events.json
          git diff --staged --quiet || git commit -m "Mise a jour programmation"
          git push
